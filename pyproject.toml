[project]
name = "fizzbuzz-tdd-kata-leonore-j"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ls", email = "leonore.jamet@centrale.centralelille.fr" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fizzbuzz-tdd-kata = "fizzbuzz_tdd_kata:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fizzbuzz_tdd_kata"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-cov"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  
 # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the
# cell displays — that pattern is exactly what flake8-bugbear's B018
# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]
"src/fizzbuzz_tdd_kata/core.py" = ["B018","F401"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90






